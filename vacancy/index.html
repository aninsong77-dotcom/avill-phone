<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>아느칸빌 공실 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800;900&display=swap');
:root{
  --bg:#dcece4; --bg2:#eef6f1; --surface:#ffffff; --surface2:#f2f7f4; --border:#e6e3db;
  --text:#20201d; --text2:#68655d; --text3:#9c988e;
  /* 층별 구분용 4색 (빨강·주황 제외 — 지하철 7호선 색으로 대체) */
  --g-blue:#1a73e8; --g-orange:#747F00; --g-yellow:#f2a600; --g-green:#188038;
  /* 상태 강조색(즉시 가능) — 지하철 7호선 색(올리브그린), 위 --g-orange 와 동일 */
  --g-now:#747F00;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Gothic A1',sans-serif;color:var(--text);line-height:1.6;
  -webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 340px,var(--bg2) 100%);
  background-attachment:fixed;
}
.wrap{max-width:860px;margin:0 auto;padding:22px 16px 60px}

/* ── 헤더 ── */
.hd{
  position:relative;overflow:hidden;background:var(--surface);border:none;
  border-radius:28px;padding:28px 24px 24px;margin-bottom:18px;
  box-shadow:0 12px 32px rgba(20,60,40,.10);
}
.hd h1{font-size:23px;font-weight:900;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.hd .sub{font-size:13px;color:var(--text2);margin-top:8px;line-height:1.7}
.hd .meta{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.hd .upd{font-size:11px;color:var(--text3)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--g-green);background:var(--surface2);padding:5px 11px;border-radius:99px}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--g-green);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(24,128,56,.4)}50%{opacity:.55;box-shadow:0 0 0 5px rgba(24,128,56,0)}}

/* ── 요약 카드 ── */
.summary{display:flex;gap:12px;margin-bottom:22px}
.sc{flex:1;background:var(--surface);border:none;border-radius:22px;padding:18px 18px 16px;box-shadow:0 8px 22px rgba(20,60,40,.07)}
.sc .lbl{font-size:12px;color:var(--text2);font-weight:700}
.sc .val{font-size:30px;font-weight:900;margin-top:6px;color:var(--accent);letter-spacing:-.5px}
.sc .val .u{font-size:13px;font-weight:700;color:var(--text3);margin-left:2px}
.sc.r{--accent:var(--g-now)} .sc.b{--accent:var(--g-blue)}

/* ── 섹션 제목 ── */
.sec-title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;margin:30px 4px 14px}
.sec-title .ic-wrap{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:10px;background:var(--sbg);color:var(--sfg);flex:none}
.sec-title .cnt{font-size:12px;font-weight:600;color:var(--text3);margin-left:auto}

/* ── 층 그룹 ── */
.floor-group{margin-bottom:6px}
.floor-group + .floor-group{margin-top:20px}
.floor-tag{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#fff;
  background:var(--fc);padding:5px 13px 5px 11px;border-radius:99px;margin-bottom:11px;
  letter-spacing:.2px;
}
.floor-tag::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;opacity:.85}

/* ── 호실 카드 그리드 (한눈에 스캔) ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:11px}
.rc{
  position:relative;background:var(--surface);border:none;
  border-top:4px solid var(--fc,var(--border));border-radius:20px;padding:16px 14px 14px;
  box-shadow:0 6px 18px rgba(20,60,40,.06);transition:transform .15s ease,box-shadow .15s ease;
}
@media(hover:hover){.rc:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(20,60,40,.12)}}
.rc.move{border-top-style:dashed}
.rc.has-memo{padding-top:44px}
.rc .room{font-size:21px;font-weight:900;letter-spacing:-.5px}
.rc .price{margin-top:9px;font-size:14px;font-weight:700}
.rc .price .dep{color:var(--g-blue)}
.rc .price .rent{color:var(--text)}
.rc .price .won{font-size:11px;color:var(--text3);font-weight:500;margin-left:2px}
.memo-btn{
  position:absolute;top:12px;left:12px;width:20px;height:20px;border-radius:50%;
  background:#747F00;border:none;color:#fff;font-family:inherit;font-size:11px;font-weight:900;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;line-height:1;
  box-shadow:0 2px 6px rgba(116,127,0,.4);
  animation:memo-float 2.2s ease-in-out infinite;
}
.memo-btn:active{transform:scale(.9);animation:none}
@keyframes memo-float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}
.memo-bubble{
  display:none;position:absolute;top:45px;left:13px;z-index:6;max-width:200px;
  background:var(--text);color:#fff;font-size:12px;font-weight:600;line-height:1.55;
  padding:9px 12px;border-radius:11px;box-shadow:0 10px 24px rgba(20,20,10,.22);word-break:break-word;
}
.memo-bubble::before{content:'';position:absolute;top:-5px;left:15px;width:10px;height:10px;background:var(--text);transform:rotate(45deg)}
.rc.memo-open .memo-bubble{display:block}
.tag-stack{position:absolute;top:13px;right:13px;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.rc .tag{font-size:10px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}
.rc .tag.now{background:#eef0d9;color:var(--g-now)}
.rc .tag.soon{background:#fef1db;color:#8a5a00}
.rc .tag.clean{background:#e6f4ea;color:var(--g-green);display:flex;align-items:center;gap:3px}
.rc .tag.clean .ic{width:.85em;height:.85em}
.rc .date{margin-top:9px;font-size:12px;color:#8a5a00;font-weight:700;display:flex;align-items:center;gap:5px}

.empty{text-align:center;padding:38px 20px;color:var(--text3);font-size:14px;font-weight:600;background:var(--surface);border:1.5px dashed var(--border);border-radius:20px}

/* ── 공지판 ── */
.notice-box{background:var(--surface);border:none;border-radius:22px;overflow:hidden;box-shadow:0 8px 22px rgba(20,60,40,.07)}
.notice-item{padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px}
.notice-item:last-child{border-bottom:none}
.notice-item .txt{white-space:pre-wrap;word-break:break-word}
.notice-item .at{font-size:11px;color:var(--text3);margin-top:5px;font-weight:600}
.notice-empty{padding:24px 16px;text-align:center;color:var(--text3);font-size:13px;font-weight:600}

/* ── 프린트 버튼 ── */
.actions{margin-top:32px;text-align:center}
.btn{
  font-family:inherit;font-size:14px;font-weight:800;padding:13px 28px;border-radius:99px;border:none;
  cursor:pointer;background:var(--g-green);color:#fff;display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 8px 20px rgba(24,128,56,.28);transition:transform .12s ease,box-shadow .12s ease;
}
.btn:active{transform:translateY(1px);box-shadow:0 2px 8px rgba(24,128,56,.25)}

/* ── 게이트(첫 진입 입력) ── */
.gate{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;
  background:
    radial-gradient(circle at 12% 18%, rgba(26,115,232,.14), transparent 45%),
    radial-gradient(circle at 88% 12%, rgba(116,127,0,.12), transparent 45%),
    radial-gradient(circle at 20% 88%, rgba(24,128,56,.12), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(242,166,0,.14), transparent 45%),
    var(--bg);
}
.gate-card{background:var(--surface);border:none;border-radius:28px;padding:32px 28px;max-width:380px;width:100%;box-shadow:0 20px 56px rgba(20,60,40,.14);position:relative;overflow:hidden}
.gate-card h2{font-size:20px;font-weight:900;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.gate-card p{font-size:13px;color:var(--text2);text-align:center;margin:10px 0 24px;line-height:1.7}
.gate-card label{display:block;font-size:12px;font-weight:800;color:var(--text2);margin:14px 0 6px}
.gate-card input{width:100%;font-family:inherit;font-size:15px;padding:12px 14px;border:1.5px solid var(--border);border-radius:14px;outline:none;background:var(--surface2);transition:border-color .12s ease,background .12s ease}
.gate-card input:focus{border-color:var(--g-blue);background:#fff}
.gate-card .err{color:var(--g-orange);font-size:12px;font-weight:700;margin-top:10px;min-height:16px;text-align:center}
.gate-card .go{width:100%;margin-top:22px;font-size:16px;font-weight:900;padding:15px;border-radius:99px;border:none;cursor:pointer;background:var(--g-blue);color:#fff;box-shadow:0 10px 24px rgba(26,115,232,.32);transition:transform .12s ease}
.gate-card .go:active{transform:translateY(1px)}

.loading{text-align:center;padding:60px 20px;color:var(--text3);font-weight:600}

/* ── 아이콘 ── */
.ic{width:1em;height:1em;vertical-align:-.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

@media(max-width:400px){.grid{grid-template-columns:repeat(auto-fill,minmax(136px,1fr))}}

/* ── 인쇄 ── */
@media print{
  body{background:#fff}
  .actions,.gate{display:none!important}
  .rc,.sc,.notice-box,.hd{box-shadow:none}
  .rc:hover{transform:none}
  @page{margin:14mm}
}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

<svg style="position:absolute;width:0;height:0" aria-hidden="true">
<symbol id="ic-home" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7"/><path d="M9 22V12h6v10"/><path d="M5 10v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10"/></symbol>
<symbol id="ic-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6"/><path d="M15.5 7.5l3 3L22 7l-3-3"/></symbol>
<symbol id="ic-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></symbol>
<symbol id="ic-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></symbol>
<symbol id="ic-printer" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></symbol>
<symbol id="ic-check" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></symbol>
</svg>

<!-- ══════ 첫 진입 게이트 ══════ -->
<div class="gate" id="gate">
  <div class="gate-card">
    <h2><svg class="ic"><use href="#ic-home"/></svg> 공실 현황 보기</h2>
    <p>부동산 정보를 입력하시면<br>실시간 공실 현황을 보실 수 있습니다.</p>
    <label>부동산 상호</label>
    <input id="g_agency" type="text" placeholder="예: 아늑공인중개사" autocomplete="organization">
    <label>담당자 이름</label>
    <input id="g_name" type="text" placeholder="예: 홍길동" autocomplete="name">
    <label>전화번호</label>
    <input id="g_phone" type="tel" inputmode="numeric" placeholder="예: 010-1234-5678" autocomplete="tel">
    <div class="err" id="g_err"></div>
    <button class="go" onclick="submitGate()">공실 현황 보기</button>
  </div>
</div>

<!-- ══════ 본문 ══════ -->
<div class="wrap" id="main" style="display:none">
  <div class="hd">
    <h1><svg class="ic"><use href="#ic-home"/></svg> 아느칸빌 공실 현황</h1>
    <div class="sub">궐동 620-1 · 관리비 포함 (전기·가스·인터넷 별도)</div>
    <div class="meta">
      <span class="live"><span class="dot"></span> 실시간 연동</span>
      <span class="upd" id="updated"></span>
    </div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="sec-title"><span class="ic-wrap" style="--sbg:#e8f0fd;--sfg:var(--g-blue)"><svg class="ic"><use href="#ic-key"/></svg></span> 즉시 입주 가능 <span class="cnt" id="cntNow"></span></div>
  <div id="nowList"></div>

  <div class="sec-title"><span class="ic-wrap" style="--sbg:#fef1db;--sfg:#8a5a00"><svg class="ic"><use href="#ic-calendar"/></svg></span> 퇴실 예정 <span class="cnt" id="cntSoon"></span></div>
  <div id="soonList"></div>

  <div class="sec-title"><span class="ic-wrap" style="--sbg:#e6f4ea;--sfg:var(--g-green)"><svg class="ic"><use href="#ic-bell"/></svg></span> 공지사항</div>
  <div class="notice-box" id="notices"></div>

  <div class="actions">
    <button class="btn" onclick="window.print()"><svg class="ic"><use href="#ic-printer"/></svg> 프린트 / PDF 저장</button>
  </div>
</div>

<div class="loading" id="loading" style="display:none">불러오는 중…</div>

<script>
// ── Firebase (읽기 전용, 로그인 없음) ──
firebase.initializeApp({
  apiKey: "AIzaSyAcP5LuRuudHxWFVYSRwZXct8n-LJhKWY0",
  authDomain: "building-1-30739.firebaseapp.com",
  projectId: "building-1-30739",
  storageBucket: "building-1-30739.firebasestorage.app",
  messagingSenderId: "543983501440",
  appId: "1:543983501440:web:eddb5f38c4d7619f6f6665"
});
const db = firebase.firestore();
const GATE_KEY = 'vacancy_visitor_v1';

// ══════ 게이트 ══════
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function submitGate(){
  const agency = document.getElementById('g_agency').value.trim();
  const name   = document.getElementById('g_name').value.trim();
  const phoneRaw = document.getElementById('g_phone').value.trim();
  const digits = phoneRaw.replace(/[^0-9]/g,'');
  const err = document.getElementById('g_err');

  if(!agency){ err.textContent='부동산 상호를 입력하세요.'; return; }
  if(!name){ err.textContent='담당자 이름을 입력하세요.'; return; }
  if(digits.length < 9 || digits.length > 11){ err.textContent='전화번호를 정확히 입력하세요.'; return; }
  err.textContent='';

  const info = { agency, name, phone: phoneRaw, at: Date.now() };
  // 방문기록 저장(쓰기만) — 실패해도 열람은 허용
  db.collection('visitors').add({
    agency, name, phone: phoneRaw,
    at: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(()=>{});

  try{ localStorage.setItem(GATE_KEY, JSON.stringify(info)); }catch(e){}
  enter();
}

function enter(){
  document.getElementById('gate').style.display='none';
  document.getElementById('main').style.display='block';
  startListening();
}

// ══════ 데이터 구독 ══════
let _started = false;
function startListening(){
  if(_started) return; _started = true;

  db.collection('public').doc('vacancy').onSnapshot(doc=>{
    const d = doc.exists ? doc.data() : {};
    renderVacancy(d.vacant||[], d.moveOuts||[], d.updatedAt);
  }, ()=> renderVacancy([],[],null));

  db.collection('public').doc('notices').onSnapshot(doc=>{
    const items = (doc.exists && doc.data().items) ? doc.data().items : [];
    renderNotices(items);
  }, ()=> renderNotices([]));
}

// ══════ 층 구분 (Google 4색 순환) ══════
const FLOOR_COLORS = ['var(--g-blue)','var(--g-orange)','var(--g-yellow)','var(--g-green)'];
function floorOf(room){
  const digits = String(room).replace(/[^0-9]/g,'');
  if(!digits) return '?';
  return digits.length<=2 ? digits.slice(0,1) : digits.slice(0, digits.length-2);
}
function floorColor(floor){
  const n = parseInt(floor,10);
  if(isNaN(n)) return 'var(--text3)';
  return FLOOR_COLORS[(n-1+FLOOR_COLORS.length*100)%FLOOR_COLORS.length];
}
function groupByFloor(rooms){
  const map = new Map();
  rooms.forEach(r=>{
    const f = floorOf(r.room);
    if(!map.has(f)) map.set(f, []);
    map.get(f).push(r);
  });
  return [...map.entries()].sort((a,b)=>{
    const na = parseInt(a[0],10), nb = parseInt(b[0],10);
    if(isNaN(na) || isNaN(nb)) return String(a[0]).localeCompare(String(b[0]));
    return na - nb;
  });
}

// ══════ 렌더: 공실 ══════
function fmtTime(ts){
  let dt;
  if(!ts) return '';
  if(ts.toDate) dt = ts.toDate();
  else if(typeof ts==='number') dt = new Date(ts);
  else return '';
  const p=n=>String(n).padStart(2,'0');
  return `${dt.getFullYear()}.${p(dt.getMonth()+1)}.${p(dt.getDate())} ${p(dt.getHours())}:${p(dt.getMinutes())}`;
}

function moveOutLabel(dateStr){
  const diff = Math.round((new Date(dateStr) - new Date(new Date().toISOString().slice(0,10)))/86400000);
  if(isNaN(diff)) return '';
  if(diff < 0) return `${Math.abs(diff)}일 지남`;
  if(diff === 0) return '오늘';
  if(diff <= 7) return `${diff}일 후`;
  if(diff <= 14) return '약 2주 후';
  if(diff <= 21) return '약 3주 후';
  if(diff <= 45) return '약 1개월 후';
  if(diff <= 75) return '약 2개월 후';
  if(diff <= 105) return '약 3개월 후';
  return `약 ${Math.round(diff/30)}개월 후`;
}

function priceHtml(dep, rent){
  if(dep==null && rent==null) return '<div class="price" style="color:var(--text3);font-size:12px;font-weight:600">문의</div>';
  return `<div class="price"><span class="dep">보 ${dep??'-'}</span> / <span class="rent">월 ${rent??'-'}</span><span class="won">만원</span></div>`;
}

function roomCard(r, kind){
  const statusTag = kind==='now'
    ? '<span class="tag now">즉시 가능</span>'
    : '<span class="tag soon">퇴실 예정</span>';
  const cleanTag = r.clean
    ? '<span class="tag clean"><svg class="ic"><use href="#ic-check"/></svg> 청소완료</span>'
    : '';
  const dateHtml = kind==='soon'
    ? `<div class="date"><svg class="ic"><use href="#ic-calendar"/></svg> ${esc(r.date)} (${moveOutLabel(r.date)})</div>`
    : '';
  const memoHtml = r.memo
    ? `<button type="button" class="memo-btn" onclick="toggleMemo(this,event)" aria-label="메모 보기">N</button>
       <div class="memo-bubble">${esc(r.memo)}</div>`
    : '';
  return `<div class="rc${kind==='soon'?' move':''}${r.memo?' has-memo':''}">
    ${memoHtml}
    <div class="tag-stack">${statusTag}${cleanTag}</div>
    <div class="room">${esc(r.room)}</div>
    ${priceHtml(r.dep, r.rent)}
    ${dateHtml}
  </div>`;
}

// 메모 말풍선 토글 — 하나만 열리고, 다른 곳 터치하면 닫힘
function toggleMemo(btn, ev){
  ev.stopPropagation();
  const card = btn.closest('.rc');
  const wasOpen = card.classList.contains('memo-open');
  document.querySelectorAll('.rc.memo-open').forEach(c=>c.classList.remove('memo-open'));
  if(!wasOpen) card.classList.add('memo-open');
}
document.addEventListener('click', ()=>{
  document.querySelectorAll('.rc.memo-open').forEach(c=>c.classList.remove('memo-open'));
});

function floorSectionsHtml(rooms, kind){
  return groupByFloor(rooms).map(([floor, list])=>`
    <div class="floor-group" style="--fc:${floorColor(floor)}">
      <div class="floor-tag">${floor}층</div>
      <div class="grid">${list.map(r=>roomCard(r,kind)).join('')}</div>
    </div>`).join('');
}

function renderVacancy(vacant, moveOuts, updatedAt){
  document.getElementById('updated').textContent = updatedAt ? '최종 업데이트 '+fmtTime(updatedAt) : '';

  document.getElementById('summary').innerHTML = [
    ['즉시 가능', vacant.length, 'r'],
    ['퇴실 예정', moveOuts.length, 'b'],
  ].map(([l,v,c])=>`<div class="sc ${c}"><div class="lbl">${l}</div><div class="val">${v}<span class="u">실</span></div></div>`).join('');

  // 즉시 입주 가능
  document.getElementById('cntNow').textContent = vacant.length ? `${vacant.length}실` : '';
  const nowEl = document.getElementById('nowList');
  nowEl.innerHTML = vacant.length
    ? floorSectionsHtml(vacant.slice().sort((a,b)=>String(a.room).localeCompare(String(b.room))), 'now')
    : '<div class="empty"><svg class="ic" style="width:1.2em;height:1.2em"><use href="#ic-check"/></svg> 현재 즉시 입주 가능한 공실이 없습니다</div>';

  // 퇴실 예정
  document.getElementById('cntSoon').textContent = moveOuts.length ? `${moveOuts.length}실` : '';
  const soonEl = document.getElementById('soonList');
  soonEl.innerHTML = moveOuts.length
    ? floorSectionsHtml(moveOuts.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))), 'soon')
    : '<div class="empty">예정된 퇴실이 없습니다.</div>';
}

// ══════ 렌더: 공지 ══════
function renderNotices(items){
  const el = document.getElementById('notices');
  if(!items.length){
    el.innerHTML = '<div class="notice-empty">등록된 공지가 없습니다.</div>';
    return;
  }
  el.innerHTML = items.slice().sort((a,b)=>(b.at||0)-(a.at||0)).map(n=>`
    <div class="notice-item">
      <div class="txt">${esc(n.text)}</div>
      <div class="at">${fmtTime(n.at)}</div>
    </div>`).join('');
}

// ══════ 시작: 이미 입력한 기기면 게이트 건너뜀 ══════
(function init(){
  // 주인용: 주소 뒤에 ?me 를 붙이면 게이트 없이 바로 보고, 방문기록도 남기지 않는다
  if(location.search.indexOf('me') >= 0){
    try{ localStorage.setItem(GATE_KEY, JSON.stringify({agency:'(주인)', name:'(주인)', phone:'-', at:Date.now(), owner:true})); }catch(e){}
    enter();
    return;
  }
  let saved=null;
  try{ saved = JSON.parse(localStorage.getItem(GATE_KEY)||'null'); }catch(e){}
  if(saved && saved.agency && saved.phone){
    enter();
  } else {
    document.getElementById('gate').style.display='flex';
  }
})();
</script>
